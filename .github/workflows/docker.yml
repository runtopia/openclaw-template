name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Runtime image type'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - documents
          - cloud
          - full
      image_version:
        description: 'Image version override (e.g. 1.2.3). Defaults to git ref.'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve runtime image type
        id: profile
        env:
          REQUESTED_IMAGE_TYPE: ${{ inputs.image_type || 'standard' }}
        run: |
          case "$REQUESTED_IMAGE_TYPE" in
            standard|documents|cloud)
              echo "runtime_profile=standard" >> "$GITHUB_OUTPUT"
              echo "document_skills=1" >> "$GITHUB_OUTPUT"
              ;;
            full)
              echo "runtime_profile=full" >> "$GITHUB_OUTPUT"
              echo "document_skills=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported image type: $REQUESTED_IMAGE_TYPE" >&2
              exit 1
              ;;
          esac
          echo "image_type=$REQUESTED_IMAGE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # standard is the deployment default: main → latest, tags → semver.
            type=semver,pattern={{version}},enable=${{ steps.profile.outputs.image_type == 'standard' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.profile.outputs.image_type == 'standard' }}
            type=raw,value=standard,enable=${{ steps.profile.outputs.image_type == 'standard' }}
            # Compatibility aliases and optional full never replace latest.
            type=raw,value=documents,enable=${{ steps.profile.outputs.image_type == 'documents' }}
            type=raw,value=cloud,enable=${{ steps.profile.outputs.image_type == 'cloud' }}
            type=raw,value=full,enable=${{ steps.profile.outputs.image_type == 'full' }}

      - name: Resolve IMAGE_VERSION
        id: ver
        run: |
          if [ -n "${{ inputs.image_version }}" ]; then
            echo "value=${{ inputs.image_version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            CACHEBUST_PLUGINS=${{ github.sha }}
            ONECLAW_RUNTIME_PROFILE=${{ steps.profile.outputs.runtime_profile }}
            ONECLAW_DOCUMENT_SKILLS=${{ steps.profile.outputs.document_skills }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
