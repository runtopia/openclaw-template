name: docker

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve IMAGE_VERSION
        id: ver
        run: |
          value="${GITHUB_REF_NAME#v}"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Extract standard metadata
        id: meta_standard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=standard
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-standard

      - name: Extract full metadata
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}}-full

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build standard first. The full target inherits it byte-for-byte and
      # imports this cache, so a normal release does not rebuild the base.
      - name: Build and push standard
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_standard.outputs.tags }}
          labels: ${{ steps.meta_standard.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=standard
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-standard

      - name: Build and push full
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=full
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-full

      - name: Notify WeChat Work
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          IMAGE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          if [[ -z "$WECOM_WEBHOOK_URL" ]]; then
            echo "::warning::WECOM_WEBHOOK_URL is not configured; skipping production release notification."
            exit 0
          fi

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
          content=$(printf '## 🚀 OneClaw Template 发布成功\n\n> **版本**：[%s](%s)\n> **镜像**：`%s`\n> **发布人**：%s\n\n[查看发布流水线](%s)' \
            "$GITHUB_REF_NAME" "$release_url" "$image" "$GITHUB_ACTOR" "$workflow_url")
          payload=$(jq -cn --arg content "$content" '{msgtype:"markdown",markdown:{content:$content}}')

          if ! response=$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$WECOM_WEBHOOK_URL"); then
            echo "::warning::Failed to send WeChat Work production release notification."
          elif ! jq -e '.errcode == 0' <<<"$response" >/dev/null; then
            echo "::warning::WeChat Work rejected the production release notification: $response"
          fi
