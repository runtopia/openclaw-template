name: docker

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve IMAGE_VERSION
        id: ver
        run: |
          value="${GITHUB_REF_NAME#v}"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Extract standard metadata
        id: meta_standard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=standard
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-standard

      - name: Extract full metadata
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}}-full

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build standard first. The full target inherits it byte-for-byte and
      # imports this cache, so a normal release does not rebuild the base.
      - name: Build and push standard
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_standard.outputs.tags }}
          labels: ${{ steps.meta_standard.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=standard
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-standard

      - name: Build and push full
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=full
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-full
