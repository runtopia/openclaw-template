name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Runtime image type (normal CI always builds both)'
        required: true
        default: both
        type: choice
        options:
          - both
          - standard
          - full
      image_version:
        description: 'Image version override (e.g. 1.2.3). Defaults to git ref.'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve requested images
        id: images
        env:
          REQUESTED_IMAGE_TYPE: ${{ inputs.image_type || 'both' }}
        run: |
          case "$REQUESTED_IMAGE_TYPE" in
            both)
              echo "build_standard=true" >> "$GITHUB_OUTPUT"
              echo "build_full=true" >> "$GITHUB_OUTPUT"
              ;;
            standard|full)
              if [ "$REQUESTED_IMAGE_TYPE" = "standard" ]; then
                echo "build_standard=true" >> "$GITHUB_OUTPUT"
                echo "build_full=false" >> "$GITHUB_OUTPUT"
              else
                echo "build_standard=false" >> "$GITHUB_OUTPUT"
                echo "build_full=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unsupported image type: $REQUESTED_IMAGE_TYPE" >&2
              exit 1
              ;;
          esac
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve IMAGE_VERSION
        id: ver
        env:
          VERSION_OVERRIDE: ${{ inputs.image_version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            value="$VERSION_OVERRIDE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${GITHUB_SHA::12}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Extract standard metadata
        if: steps.images.outputs.build_standard == 'true'
        id: meta_standard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=standard
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-standard
            type=raw,value=${{ steps.ver.outputs.value }}-standard,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Extract full metadata
        if: steps.images.outputs.build_full == 'true'
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=full
            type=semver,pattern={{version}}-full
            type=raw,value=${{ steps.ver.outputs.value }}-full,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build standard first. The full target inherits it byte-for-byte and
      # imports this cache, so a normal release does not rebuild the base.
      - name: Build and push standard
        if: steps.images.outputs.build_standard == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_standard.outputs.tags }}
          labels: ${{ steps.meta_standard.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=standard
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-standard

      - name: Build and push full
        if: steps.images.outputs.build_full == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.value }}
            ONECLAW_RUNTIME_PROFILE=full
          cache-from: |
            type=gha,scope=runtime-standard
            type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-full
