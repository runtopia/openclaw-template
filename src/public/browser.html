<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>助手的工作画面</title><link rel="stylesheet" href="/browser/viewer.css"></head>
<body>
<header><strong>工作画面</strong><span id="status" role="status">正在连接画面…</span><button id="start" disabled>打开浏览器</button><button id="takeover" hidden>我来操作</button><button id="release" hidden>让助手继续</button><button id="recover" hidden>让助手继续</button><button id="reconnect">重新连接画面</button></header>
<p id="control-status" role="status">正在查看谁在操作…</p><p>需要登录或亲自操作时，你可以接手。完成后点击“让助手继续”；如果助手已经结束回复，在聊天里发“继续”即可。</p>
<main id="screen" aria-label="助手正在使用的浏览器"></main>
<script type="module" src="/browser/viewer.js"></script>
</body></html>
