<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>助手的工作画面</title><link rel="stylesheet" href="/browser/viewer.css"></head>
<body>
<header><div class="heading"><strong>工作画面</strong><span id="control-status" role="status">正在确认操作状态…</span></div><button id="start" disabled>打开浏览器</button><button id="takeover" class="primary" hidden>我来操作</button><button id="release" class="primary" hidden>让助手继续</button><button id="recover" class="primary" hidden>恢复 AI</button><details><summary aria-label="更多画面选项">•••</summary><div class="menu"><button id="retain-task" hidden>保留页面供稍后使用</button><button id="close-task" hidden>关闭任务网页</button><button id="reconnect">重新连接画面</button><p>接管过的页面会保留，避免丢失未提交内容。无需继续使用时，可以恢复自动清理或关闭网页；登录资料保留。</p></div></details></header>
<nav id="task-tabs" aria-label="任务标签页" hidden></nav>
<main id="stage" aria-label="助手正在使用的浏览器"><div id="surface"><div id="screen"></div><div id="input-screen"></div></div><div id="scoped-task" hidden><canvas id="task-canvas" aria-label="所选任务网页"></canvas></div><div id="task-snapshot" hidden><img id="task-snapshot-image" alt="此任务的最后画面"><p id="task-snapshot-label">此任务页面暂不可用</p></div></main>
<footer><span id="status" role="status">正在连接画面…</span><button id="zoom" aria-pressed="false">放大阅读</button><button id="pan" hidden aria-pressed="false">移动画面</button><button id="keyboard" hidden title="先点网页输入框，再打开键盘">键盘</button></footer>
<textarea id="keyboard-input" aria-label="输入到远端网页" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<script type="module" src="/browser/viewer.js"></script>
</body></html>
